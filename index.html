<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>텍스트 복사</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      cursor: pointer;
    }

    #text {
      font-size: 20px;
      margin: 30px 0;
      word-break: break-all;
    }

    #message {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>텍스트 복사</h2>

  <p>아래 내용을 복사합니다.</p>

  <div id="text"></div>

  <button onclick="copyText()">복사하기</button>

  <p id="message"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const text = params.get("text") || "복사할 텍스트가 없습니다.";

    document.getElementById("text").innerText = text;

    async function copyText() {
      try {
        await navigator.clipboard.writeText(text);

        document.getElementById("message").innerText =
          "✓ 복사되었습니다.";

      } catch (err) {
        document.getElementById("message").innerText =
          "복사하지 못했습니다.";
      }
    }
  </script>

</body>
</html>
